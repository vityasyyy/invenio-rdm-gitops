[uwsgi]
http = 0.0.0.0:5000
stats = 0.0.0.0:9000
# Combined app serves BOTH the UI and the /api REST routes (same as the old
# gunicorn invenio_app.wsgi). Using wsgi_ui here would drop the REST API.
module = invenio_app.wsgi:application
master = true
die-on-term = true
processes = 2
threads = 2
single-interpreter = true
buffer-size = 8192
wsgi-disable-file-wrapper = true
