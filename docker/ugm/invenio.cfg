"""
InvenioRDM settings for the UGM Research Data Repository (invenio-ugm).

Institution-specific values are read from plain (non ``INVENIO_``-prefixed)
environment variables so this same file works unmodified for any deployment
(local dev, another university, another VPS) -- only the ``.env`` file needs
to change. See ``.env.example`` and ``README.md`` for the full list of
variables and how to set them for a new environment.

For the full list of Invenio settings and their values, see
https://inveniordm.docs.cern.ch/operate/customize/configuration/.
"""

import os
from datetime import datetime
from invenio_i18n import lazy_gettext as _


def _(x):  # needed to avoid start time failure with lazy strings
    return x


# Instance identity
# ==================
# These drive THEME_*, SITE_*, OAISERVER_* and deposit-form defaults below,
# so a fresh deployment only needs to change the environment, not this file.

INSTANCE_DOMAIN = os.environ.get("INSTANCE_DOMAIN", "localhost")
INSTANCE_NAME = os.environ.get("INSTANCE_NAME", "UGM Research Data Repository")
INSTANCE_TAGLINE = os.environ.get(
    "INSTANCE_TAGLINE",
    "Share your research. Grow its impact. Keep it safe for the future.",
)
