# ==================== Kubernetes cluster overrides ====================
# Deterministic overrides for the GitOps deployment. The image defaults
# come from env vars, so the ConfigMap controls everything at runtime.
import json as _json

# Site URLs: UI host stays invenio.vityasy.me; API host is separate.
INSTANCE_UI_URL = os.environ.get("INSTANCE_UI_URL", INSTANCE_UI_URL)
SITE_UI_URL = os.environ.get("INVENIO_SITE_UI_URL", INSTANCE_UI_URL)
SITE_API_URL = os.environ.get("INVENIO_SITE_API_URL", f"{INSTANCE_UI_URL}/api")
INSTANCE_DOMAIN = os.environ.get("INSTANCE_DOMAIN", INSTANCE_DOMAIN)

# Trusted hosts: UI + API hosts + k8s internals
_api_host = SITE_API_URL.replace("https://", "").replace("http://", "").split("/")[0]
TRUSTED_HOSTS = [INSTANCE_DOMAIN, _api_host, "0.0.0.0", "localhost", "127.0.0.1"] \
    if _api_host and _api_host != INSTANCE_DOMAIN else TRUSTED_HOSTS

# Search hosts — cluster's OpenSearch via the ExternalName service.
# UGM default is localhost:9200 which does not exist in-cluster.
SEARCH_HOSTS = _json.loads(os.environ.get("INVENIO_SEARCH_HOSTS", "[]")) \
    or ["localhost:9200"]

# Celery broker/backend — the cluster uses Redis (no RabbitMQ).
CELERY_BROKER_URL = os.environ.get(
    "INVENIO_CELERY_BROKER_URL", "redis://localhost:6379/0"
)
CELERY_RESULT_BACKEND = os.environ.get(
    "INVENIO_CELERY_RESULT_BACKEND", "redis://localhost:6379/2"
)
BROKER_URL = CELERY_BROKER_URL

# Mail (Flask-Mail) — SMTP relay for confirmation/reset emails.
# Registration requires email confirmation (SECURITY_CONFIRMABLE=True above),
# so without a working relay users can never log in. The cluster supplies the
# real relay via the ConfigMap (MAIL_SERVER/MAIL_PORT/MAIL_USE_TLS/
# MAIL_DEFAULT_SENDER) and the credentials via the invenio-app-secrets
# SealedSecret (MAIL_USERNAME/MAIL_PASSWORD). Defaults keep local dev working
# (localhost:25, no auth) until the operator supplies university relay creds.
MAIL_SERVER = os.environ.get("MAIL_SERVER", "localhost")
MAIL_PORT = int(os.environ.get("MAIL_PORT", "25"))
MAIL_USE_TLS = os.environ.get("MAIL_USE_TLS", "false").lower() == "true"
MAIL_USE_SSL = os.environ.get("MAIL_USE_SSL", "false").lower() == "true"
MAIL_USERNAME = os.environ.get("MAIL_USERNAME", "")
MAIL_PASSWORD = os.environ.get("MAIL_PASSWORD", "")
MAIL_DEFAULT_SENDER = os.environ.get("MAIL_DEFAULT_SENDER", INSTANCE_ADMIN_EMAIL)
SECURITY_EMAIL_SENDER = os.environ.get("SECURITY_EMAIL_SENDER", MAIL_DEFAULT_SENDER)
