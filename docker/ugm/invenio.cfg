INSTANCE_ADMIN_EMAIL = os.environ.get("INSTANCE_ADMIN_EMAIL", "admin@example.org")
_scheme = "http" if INSTANCE_DOMAIN in ("localhost", "127.0.0.1") else "https"
INSTANCE_UI_URL = os.environ.get(
    "INSTANCE_UI_URL", f"{_scheme}://{INSTANCE_DOMAIN}"
)

# Flask
# =====
# See https://flask.palletsprojects.com/en/1.1.x/config/

# Define the value of the cache control header `max-age` returned by the server when serving
# public files. Files will be cached by the browser for the provided number of seconds.
# See flask documentation for more information:
# https://flask.palletsprojects.com/en/2.1.x/config/#SEND_FILE_MAX_AGE_DEFAULT
SEND_FILE_MAX_AGE_DEFAULT = 300

# SECURITY WARNING: keep the secret key used in production secret!
# Do not commit it to a source code repository.
# Overridden in production via the INVENIO_SECRET_KEY env var (see .env.example).
SECRET_KEY = os.environ.get("INVENIO_SECRET_KEY", "CHANGE-ME-dev-only-insecure-key")

# Since HAProxy and Nginx route all requests no matter the host header
# provided, the trusted hosts variable is set to localhost. In production it
# should be set to the correct host and it is strongly recommended to only
# route correct hosts to the application.
TRUSTED_HOSTS = [INSTANCE_DOMAIN, '0.0.0.0', 'localhost', '127.0.0.1']


