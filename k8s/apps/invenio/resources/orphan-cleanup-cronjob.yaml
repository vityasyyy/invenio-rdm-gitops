apiVersion: batch/v1
kind: CronJob
metadata:
  name: invenio-orphan-cleanup
  namespace: invenio
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  labels:
    app.kubernetes.io/name: invenio-orphan-cleanup
    app.kubernetes.io/part-of: invenio-rdm
spec:
  schedule: "15 4 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 600
      ttlSecondsAfterFinished: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: invenio-orphan-cleanup
            app.kubernetes.io/part-of: invenio-rdm
        spec:
          restartPolicy: Never
          serviceAccountName: default
          securityContext:
            runAsNonRoot: true
            runAsUser: 1654
            runAsGroup: 1654
            fsGroup: 1654
            seccompProfile:
              type: RuntimeDefault
          volumes:
            - name: scripts
              configMap:
                name: invenio-orphan-cleanup-script
            - name: tmp
              emptyDir: {}
          containers:
            - name: cleanup
              image: ghcr.io/vityasyyy/invenio-ugm:latest
              imagePullPolicy: IfNotPresent
              command:
                - invenio
                - shell
                - -c
                - exec(open('/scripts/cleanup.py').read())
              env:
                - name: PYTHONDONTWRITEBYTECODE
                  value: "1"
              envFrom:
                - configMapRef:
                    name: invenio-app-config
                - secretRef:
                    name: invenio-app-secrets
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 200m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 1654
                seccompProfile:
                  type: RuntimeDefault
