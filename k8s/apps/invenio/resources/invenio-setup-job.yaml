# InvenioRDM post-sync postcondition verification (read-only).
#
# This hook must not initialize, migrate, import fixtures, declare queues or
# rebuild indexes. It uses the same effective configuration and secrets as the
# application, but only reads state. A failure is an inspection signal, not a
# trigger to run the full initialization Job: use targeted, approved remediation.
# Full initialization is only for a verified incomplete initial setup.
apiVersion: batch/v1
kind: Job
metadata:
  name: invenio-setup
  namespace: invenio
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: invenio-setup
        app.kubernetes.io/part-of: invenio-rdm
    spec:
      serviceAccountName: default
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        fsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      restartPolicy: Never
      # Read-only mounts keep the instance paths and runtime context consistent
      # with the application; the verification performs no file writes.
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: invenio-data
            readOnly: true
        - name: archive
          persistentVolumeClaim:
            claimName: invenio-archive
            readOnly: true
      containers:
        - name: verify
          image: ghcr.io/vityasyyy/invenio-ugm:latest
          imagePullPolicy: Always
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail

              fail() {
                echo "ERROR: $*" >&2
                exit 1
              }

              echo "=== InvenioRDM postcondition verification (read-only) ==="

              python3 - <<'PY'
              import socket, time, urllib.request

              def wait_tcp(host, port, name):
                  for i in range(60):
                      try:
                          socket.create_connection((host, port), timeout=3).close()
                          print(f"{name} ready")
                          return
                      except Exception:
                          print(f"Waiting for {name}... ({i+1}/60)")
                          time.sleep(5)
                  raise RuntimeError(f"{name} not available after 5 minutes")

              def wait_http(url, name):
                  for i in range(60):
                      try:
                          urllib.request.urlopen(url, timeout=3)
                          print(f"{name} ready")
                          return
                      except Exception:
                          print(f"Waiting for {name}... ({i+1}/60)")
                          time.sleep(5)
                  raise RuntimeError(f"{name} not available after 5 minutes")

              wait_tcp("invenio-postgresql.invenio.svc.cluster.local", 5432, "PostgreSQL")
              wait_tcp("invenio-redis.invenio.svc.cluster.local", 6379, "Redis")
              wait_http("http://invenio-search.invenio.svc.cluster.local:9200/_cluster/health", "OpenSearch")
              PY

              echo "[1/5] Alembic schema heads"
              invenio shell -c '
              from flask import current_app

              alembic = current_app.extensions["invenio-db"].alembic
              current = set(alembic.migration_context.get_current_heads())
              heads = {revision.revision for revision in alembic.heads(resolve_dependencies=True)}
              if not heads:
                  raise SystemExit("ERROR: no Alembic heads found")
              if not current:
                  raise SystemExit("ERROR: no current Alembic revisions found")
              behind = sorted(current - heads)
              missing = sorted(heads - current)
              if behind or missing:
                  raise SystemExit(
                      "ERROR: database schema is not at all image heads; "
                      f"behind={behind} missing={missing}. "
                      "Inspect Alembic current/heads and apply targeted approved "
                      "migration. Do not run fixtures or reindex for this check."
                  )
              print(f"Alembic schema at all {len(heads)} heads")
              '

              echo "[2/5] Default file location"
              LOCATIONS="$(invenio files location list 2>&1)" \
                || fail "files location list failed: $LOCATIONS"
              grep -q 'default-location' <<<"$LOCATIONS" \
                || fail "default-location is missing; inspect the location list and create or set-default only with approval. Do not run full initialization for this check."

              echo "[3/5] Search indices"
              INDICES="$(invenio index list 2>&1)" \
                || fail "index list failed: $INDICES"
              grep -q 'rdmrecords-records' <<<"$INDICES" \
                || fail "rdmrecords-records index alias is missing; inspect the index list and initialize the specific missing alias only with approval. Do not run full initialization for this check."

              echo "[4/5] Declared queues"
              QUEUES="$(invenio queues list 2>&1)" \
                || fail "queues list failed: $QUEUES"
              for queue in stats-file-download stats-record-view; do
                grep -qx "$queue" <<<"$QUEUES" \
                  || fail "queue $queue is missing; inspect the queue list and declare the specific missing queue only with approval. Do not run full initialization for this check."
              done

              echo "[5/5] Admin role and superuser permission"
              ADMIN_RESULT="$(invenio shell -c '
              from invenio_db import db
              from invenio_accounts.models import Role
              from invenio_access.models import ActionRoles
              from invenio_access.permissions import superuser_access
              role = db.session.query(Role).filter(Role.name == "admin").one_or_none()
              if role is None:
                  print("STATE:missing-role")
              elif db.session.query(ActionRoles).filter(
                  ActionRoles.action == superuser_access.value,
                  ActionRoles.role_id == role.id,
              ).count() == 0:
                  print("STATE:missing-permission")
              else:
                  print("STATE:ok")
              ' 2>&1)" || fail "admin role query failed: $ADMIN_RESULT"
              ADMIN_STATE="$(grep '^STATE:' <<<"$ADMIN_RESULT" | tail -1 | cut -d: -f2)"
              [ -n "$ADMIN_STATE" ] \
                || fail "admin role query returned no state: $ADMIN_RESULT"
              [ "$ADMIN_STATE" = "ok" ] \
                || fail "admin role state is '$ADMIN_STATE'; inspect the role and superuser permission and grant only the specific missing access with approval. Do not run full initialization for a single grant."

              echo "All setup postconditions are satisfied. For any missing state, use targeted approved remediation; this proves presence only, not application correctness or recovery."
          # Effective DB/search/broker settings are required; do not inline or print them.
          envFrom:
            - configMapRef:
                name: invenio-app-config
            - secretRef:
                name: invenio-app-secrets
          volumeMounts:
            - name: data
              mountPath: /opt/invenio/var/instance/data
              readOnly: true
            - name: archive
              mountPath: /opt/invenio/var/instance/archive
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
