# InvenioRDM post-sync postcondition verification (read-only).
#
# This hook must not initialize, migrate, import fixtures, declare queues or
# rebuild indexes. Those operations belong to the separately approved
# initialization Job under initialization/ and are never part of routine syncs.
# A missing postcondition fails the hook with an actionable message.
apiVersion: batch/v1
kind: Job
metadata:
  name: invenio-setup
  namespace: invenio
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: invenio-setup
        app.kubernetes.io/part-of: invenio-rdm
    spec:
      serviceAccountName: default
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        fsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      restartPolicy: Never
      containers:
        - name: verify
          image: ghcr.io/vityasyyy/invenio-ugm:latest
          imagePullPolicy: Always
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail

              fail() {
                echo "ERROR: $*" >&2
                exit 1
              }

              echo "=== InvenioRDM postcondition verification (read-only) ==="

              python3 - <<'PY'
              import socket, time, urllib.request

              def wait_tcp(host, port, name):
                  for i in range(60):
                      try:
                          socket.create_connection((host, port), timeout=3).close()
                          print(f"{name} ready")
                          return
                      except Exception:
                          print(f"Waiting for {name}... ({i+1}/60)")
                          time.sleep(5)
                  raise RuntimeError(f"{name} not available after 5 minutes")

              def wait_http(url, name):
                  for i in range(60):
                      try:
                          urllib.request.urlopen(url, timeout=3)
                          print(f"{name} ready")
                          return
                      except Exception:
                          print(f"Waiting for {name}... ({i+1}/60)")
                          time.sleep(5)
                  raise RuntimeError(f"{name} not available after 5 minutes")

              wait_tcp("invenio-postgresql.invenio.svc.cluster.local", 5432, "PostgreSQL")
              wait_tcp("invenio-redis.invenio.svc.cluster.local", 6379, "Redis")
              wait_http("http://invenio-search.invenio.svc.cluster.local:9200/_cluster/health", "OpenSearch")
              PY

              echo "[1/5] Alembic schema heads"
              CURRENT="$(invenio alembic current 2>&1)" \
                || fail "alembic current failed: $CURRENT"
              grep -q '(head)' <<<"$CURRENT" \
                || fail "database schema is missing Alembic heads; run the approved invenio-initialize Job"

              echo "[2/5] Default file location"
              LOCATIONS="$(invenio files location list 2>&1)" \
                || fail "files location list failed: $LOCATIONS"
              grep -q 'default-location' <<<"$LOCATIONS" \
                || fail "default-location is missing; run the approved invenio-initialize Job"

              echo "[3/5] Search indices"
              INDICES="$(invenio index list 2>&1)" \
                || fail "index list failed: $INDICES"
              grep -q 'rdmrecords-records' <<<"$INDICES" \
                || fail "rdmrecords-records index alias is missing; run the approved invenio-initialize Job"

              echo "[4/5] Declared queues"
              QUEUES="$(invenio queues list 2>&1)" \
                || fail "queues list failed: $QUEUES"
              for queue in stats-file-download stats-record-view; do
                grep -qx "$queue" <<<"$QUEUES" \
                  || fail "queue $queue is missing; run the approved invenio-initialize Job"
              done

              echo "[5/5] Admin role and superuser permission"
              ADMIN_STATE="$(invenio shell -c '
              from invenio_db import db
              from invenio_accounts.models import Role
              from invenio_access.models import ActionRoles
              from invenio_access.permissions import superuser_access
              role = db.session.query(Role).filter(Role.name == "admin").one_or_none()
              if role is None:
                  print("missing-role")
              elif db.session.query(ActionRoles).filter(
                  ActionRoles.action == superuser_access.value,
                  ActionRoles.role_id == role.id,
              ).count() == 0:
                  print("missing-permission")
              else:
                  print("ok")
              ' 2>/dev/null)" || fail "admin role verification failed"
              [ "$ADMIN_STATE" = "ok" ] \
                || fail "admin role state is '$ADMIN_STATE'; run the approved invenio-initialize Job"

              echo "All setup postconditions are satisfied."
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
