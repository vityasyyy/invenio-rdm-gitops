apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: debug-output-writer
  namespace: invenio
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["invenio-debug-output"]
    verbs: ["create", "update", "patch", "get"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: debug-output-writer
  namespace: invenio
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
subjects:
  - kind: ServiceAccount
    name: default
    namespace: invenio
roleRef:
  kind: Role
  name: debug-output-writer
  apiGroup: rbac.authorization.k8s.io
