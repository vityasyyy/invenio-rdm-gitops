apiVersion: v1
kind: ResourceQuota
metadata:
  name: invenio-quota
  namespace: invenio
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  hard:
    requests.cpu: "6"
    # NOTE (2026-09-27, quota-overcommit): requests.memory 12Gi -> 7Gi.
    # Steady ~2.1Gi / HPA-max ~2.9Gi / rollout-surge ~4.5Gi (+0.5Gi setup Job
    # transient = 5.0Gi worst pattern). 7Gi = 1.4x worst pattern, 2.4x max,
    # and reserves HPA 2->3 growth (alert-hpa worker to confirm). Aggregate
    # quota sum was 2.09x node allocatable (fires KubeMemoryQuotaOvercommit
    # at >1.5x); this cut contributes -5Gi toward the <34.8Gi budget.
    requests.memory: "7Gi"
    limits.cpu: "16"
    limits.memory: "32Gi"
    pods: "30"
    services: "15"
    persistentvolumeclaims: "20"
    secrets: "30"
    configmaps: "30"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: invenio-limits
  namespace: invenio
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  limits:
    - default:
        cpu: "500m"
        memory: "512Mi"
      defaultRequest:
        cpu: "100m"
        memory: "128Mi"
      max:
        cpu: "2"
        memory: "8Gi"
      min:
        cpu: "25m"
        memory: "32Mi"
      type: Container
