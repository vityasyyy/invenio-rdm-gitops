apiVersion: v1
kind: ResourceQuota
metadata:
  name: invenio-quota
  namespace: invenio
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  hard:
    requests.cpu: "6"
    # NOTE (2026-09-27, quota-overcommit; lead reconciliation for #131):
    # requests.memory 12Gi -> 8Gi (worker proposed 7Gi; lead raised to 8Gi
    # to fit HPA max 4/4 rollout surge: (5x544Mi web)+(5x800Mi worker)+
    # scheduler 288Mi+setup Job 0.5Gi worst pattern ~= 7.4Gi. 8Gi = 1.1x
    # worst pattern and keeps aggregate 28.5Gi = 1.23x node allocatable,
    # still clears KubeMemoryQuotaOvercommit (>1.5x threshold).
    requests.memory: "8Gi"
    limits.cpu: "16"
    limits.memory: "32Gi"
    pods: "30"
    services: "15"
    persistentvolumeclaims: "20"
    secrets: "30"
    configmaps: "30"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: invenio-limits
  namespace: invenio
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  limits:
    - default:
        cpu: "500m"
        memory: "512Mi"
      defaultRequest:
        cpu: "100m"
        memory: "128Mi"
      max:
        cpu: "2"
        memory: "8Gi"
      min:
        cpu: "25m"
        memory: "32Mi"
      type: Container
