# Temporary diagnostic job — run via ArgoCD sync, delete after debugging.
apiVersion: batch/v1
kind: Job
metadata:
  name: invenio-debug
  namespace: invenio
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: invenio-debug
        app.kubernetes.io/part-of: invenio-rdm
    spec:
      serviceAccountName: default
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        fsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      restartPolicy: Never
      containers:
        - name: debug
          image: ghcr.io/vityasyyy/invenio-rdm-custom:latest
          imagePullPolicy: Always
          command:
            - /bin/bash
            - -c
            - |
              set +e
              echo "=== InvenioRDM Debug Diagnostics ==="
              echo "Timestamp: $(date -u)"

              OUTPUT=""
              append() { OUTPUT="${OUTPUT}$1\n"; echo "$1"; }

              append "=== 1. DB connection ==="
              DB_RESULT=$(python3 -c "import base64; exec(base64.b64decode(b'').decode())" 2>&1) || DB_RESULT="shell-error: $?"
              append "$DB_RESULT"

              append "=== 2. Alembic status ==="
              ALEMBIC_CURRENT=$(invenio alembic current 2>&1 | tail -5) || ALEMBIC_CURRENT="shell-error: $?"
              append "current: $ALEMBIC_CURRENT"
              ALEMBIC_HEADS=$(invenio alembic heads 2>&1 | tail -5) || ALEMBIC_HEADS="shell-error: $?"
              append "heads: $ALEMBIC_HEADS"

              append "=== 3. OpenSearch health ==="
              OS_HEALTH=$(curl -s --max-time 10 "http://invenio-search.invenio.svc.cluster.local:9200/_cluster/health" 2>&1) || OS_HEALTH="curl-error: $?"
              append "$OS_HEALTH"
              OS_INDICES=$(curl -s --max-time 10 "http://invenio-search.invenio.svc.cluster.local:9200/_cat/indices?h=index,status,docs.count" 2>&1 | grep -v "^\." | head -20) || OS_INDICES="curl-error"
              append "indices: $OS_INDICES"

              append "=== 4. S3/MinIO connectivity ==="
              S3_RESULT=$(python3 -c "import base64; exec(base64.b64decode(b'').decode())" 2>&1) || S3_RESULT="shell-error: $?"
              append "$S3_RESULT"

              append "=== 5. File locations ==="
              FILE_LOC=$(invenio files location list 2>&1) || FILE_LOC="shell-error: $?"
              append "$FILE_LOC"

              append "=== 6a. Create draft WITHOUT files ==="
              NO_FILES_RESULT=$(python3 -c "import base64; exec(base64.b64decode(b'').decode())" 2>&1) || NO_FILES_RESULT="shell-error: $?"
              append "$NO_FILES_RESULT"

              append "=== 6b. Create draft WITH files ==="
              WITH_FILES_RESULT=$(python3 -c "import base64; exec(base64.b64decode(b'').decode())" 2>&1) || WITH_FILES_RESULT="shell-error: $?"
              append "$WITH_FILES_RESULT"

              append "=== 7. Effective config ==="
              SEARCH_CFG=$(python3 -c "import base64; exec(base64.b64decode(b'').decode())" 2>&1) || SEARCH_CFG="shell-error: $?"
              append "$SEARCH_CFG"

              append "=== Debug complete ==="

              printf '%s' "$OUTPUT" > /tmp/debug_output.txt

              python3 -c "import base64; exec(base64.b64decode(b'').decode())" 2>&1
              echo "=== ConfigMap write complete ==="
          envFrom:
            - configMapRef:
                name: invenio-app-config
            - secretRef:
                name: invenio-app-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
