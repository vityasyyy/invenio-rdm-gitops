# Temporary diagnostic job — run via ArgoCD sync, delete after debugging.
apiVersion: batch/v1
kind: Job
metadata:
  name: invenio-debug
  namespace: invenio
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: invenio-debug
        app.kubernetes.io/part-of: invenio-rdm
    spec:
      serviceAccountName: default
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        fsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      restartPolicy: Never
      containers:
        - name: debug
          image: ghcr.io/vityasyyy/invenio-rdm-custom:latest
          imagePullPolicy: Always
          command:
            - /bin/bash
            - -c
            - |
              set +e
              echo "=== InvenioRDM Debug Diagnostics ==="
              echo "Timestamp: $(date -u)"

              # Collect all output for ConfigMap — never exit early
              OUTPUT=""
              append() { OUTPUT="${OUTPUT}$1\n"; echo "$1"; }

              append "=== 1. DB connection ==="
              DB_RESULT=$(python3 -c "
              import os, psycopg2
              try:
                  dsn = os.environ.get('INVENIO_SQLALCHEMY_DATABASE_URI', '')
                  if dsn:
                      import re
                      m = re.match(r'postgresql\+psycopg2://([^:]+):([^@]+)@([^:]+):(\d+)/(.+)', dsn)
                      conn = psycopg2.connect(host=m.group(3), port=m.group(4), dbname=m.group(5), user=m.group(1), password=m.group(2))
                  else:
                      conn = psycopg2.connect(host=os.environ['INVENIO_DB_HOST'], port=os.environ['INVENIO_DB_PORT'], dbname=os.environ['INVENIO_DB_NAME'], user=os.environ['INVENIO_DB_USER'], password=os.environ.get('INVENIO_DB_PASSWORD',''))
                  cur = conn.cursor()
                  cur.execute('SELECT version()')
                  print('OK:', cur.fetchone()[0][:50])
                  conn.close()
              except Exception as e:
                  print('FAILED:', e)
              " 2>&1) || DB_RESULT="shell-error: $?"
              append "$DB_RESULT"

              append "=== 2. Alembic status ==="
              ALEMBIC_CURRENT=$(invenio alembic current 2>&1 | tail -5) || ALEMBIC_CURRENT="shell-error: $?"
              append "current: $ALEMBIC_CURRENT"
              ALEMBIC_HEADS=$(invenio alembic heads 2>&1 | tail -5) || ALEMBIC_HEADS="shell-error: $?"
              append "heads: $ALEMBIC_HEADS"

              append "=== 3. OpenSearch health ==="
              OS_HEALTH=$(curl -s --max-time 10 "http://invenio-search.invenio.svc.cluster.local:9200/_cluster/health" 2>&1) || OS_HEALTH="curl-error: $?"
              append "$OS_HEALTH"
              OS_INDICES=$(curl -s --max-time 10 "http://invenio-search.invenio.svc.cluster.local:9200/_cat/indices?h=index,status,docs.count" 2>&1 | grep -v "^\." | head -20) || OS_INDICES="curl-error"
              append "indices: $OS_INDICES"

              append "=== 4. S3/MinIO connectivity ==="
              S3_RESULT=$(python3 -c "
              import boto3, os
              from botocore.config import Config
              try:
                  s3 = boto3.client('s3', endpoint_url=os.environ.get('INVENIO_S3_ENDPOINT','http://minio.minio.svc.cluster.local:9000'),
                      aws_access_key_id=os.environ.get('INVENIO_S3_ACCESS_KEY_ID',''),
                      aws_secret_access_key=os.environ.get('INVENIO_S3_SECRET_ACCESS_KEY',''),
                      config=Config(signature_version='s3v4'), region_name='us-east-1')
                  buckets = [b['Name'] for b in s3.list_buckets()['Buckets']]
                  print('OK buckets:', buckets)
              except Exception as e:
                  print('FAILED:', e)
              " 2>&1) || S3_RESULT="shell-error: $?"
              append "$S3_RESULT"

              append "=== 5. File locations ==="
              FILE_LOC=$(invenio files location list 2>&1) || FILE_LOC="shell-error: $?"
              append "$FILE_LOC"

              append "=== 6a. Create draft WITHOUT files ==="
              NO_FILES_RESULT=$(python3 -c "
              import traceback
              try:
                  from invenio_app.factory import create_app
                  app = create_app()
                  with app.app_context():
                      from invenio_access.permissions import system_identity
                      from invenio_rdm_records.proxies import current_rdm_records_service as svc
                      draft = svc.create(system_identity, {
                          'metadata': {'resource_type': {'id': 'publication-article'}, 'title': 'Debug test', 'creators': [{'person_or_org': {'type': 'personal', 'given_name': 'Test', 'family_name': 'Debug'}}], 'publication_date': '2026-01-01', 'publisher': 'Test'},
                          'access': {'record': 'public', 'files': 'public'},
                          'files': {'enabled': False}
                      })
                      print('SUCCESS no-files, id:', draft.id)
                      svc.delete_draft(system_identity, draft.id)
              except Exception as e:
                  print('FAILED:', type(e).__name__, str(e))
                  traceback.print_exc()
              " 2>&1) || NO_FILES_RESULT="shell-error: $?"
              append "$NO_FILES_RESULT"

              append "=== 6b. Create draft WITH files ==="
              WITH_FILES_RESULT=$(python3 -c "
              import traceback
              try:
                  from invenio_app.factory import create_app
                  app = create_app()
                  with app.app_context():
                      from invenio_access.permissions import system_identity
                      from invenio_rdm_records.proxies import current_rdm_records_service as svc
                      draft = svc.create(system_identity, {
                          'metadata': {'resource_type': {'id': 'publication-article'}, 'title': 'Debug test files', 'creators': [{'person_or_org': {'type': 'personal', 'given_name': 'Test', 'family_name': 'Debug'}}], 'publication_date': '2026-01-01', 'publisher': 'Test'},
                          'access': {'record': 'public', 'files': 'public'},
                          'files': {'enabled': True}
                      })
                      print('SUCCESS with-files, id:', draft.id)
                      svc.delete_draft(system_identity, draft.id)
              except Exception as e:
                  print('FAILED:', type(e).__name__, str(e))
                  traceback.print_exc()
              " 2>&1) || WITH_FILES_RESULT="shell-error: $?"
              append "$WITH_FILES_RESULT"

              append "=== 7. Effective config ==="
              SEARCH_CFG=$(python3 -c "
              import traceback
              try:
                  from invenio_app.factory import create_app
                  app = create_app()
                  with app.app_context():
                      print('SEARCH_HOSTS:', app.config.get('SEARCH_HOSTS'))
                      print('SQLALCHEMY_DATABASE_URI:', str(app.config.get('SQLALCHEMY_DATABASE_URI',''))[:80])
                      print('FILES_REST_STORAGE_FACTORY:', app.config.get('FILES_REST_STORAGE_FACTORY'))
                      print('S3_ENDPOINT_URL:', app.config.get('S3_ENDPOINT_URL'))
                      print('DATACITE_ENABLED:', app.config.get('DATACITE_ENABLED'))
                      print('RATELIMIT_STORAGE_URI:', app.config.get('RATELIMIT_STORAGE_URI'))
              except Exception as e:
                  print('FAILED:', e)
                  traceback.print_exc()
              " 2>&1) || SEARCH_CFG="shell-error: $?"
              append "$SEARCH_CFG"

              append "=== Debug complete ==="

              # Write results to ConfigMap via Kubernetes API
              TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
              NAMESPACE=$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)
              CA=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt

              ESCAPED=$(printf '%s' "$OUTPUT" | python3 -c "import sys,json; print(json.dumps(sys.stdin.read()))")
              CM_BODY="{\"apiVersion\":\"v1\",\"kind\":\"ConfigMap\",\"metadata\":{\"name\":\"invenio-debug-output\",\"namespace\":\"${NAMESPACE}\"},\"data\":{\"output\":${ESCAPED}}}"

              # Try POST first; if 409 (already exists), PATCH instead
              RESP=$(curl -sk --cacert $CA \
                -H "Authorization: Bearer $TOKEN" \
                -H "Content-Type: application/json" \
                -X POST \
                "https://kubernetes.default.svc/api/v1/namespaces/${NAMESPACE}/configmaps" \
                -d "$CM_BODY")
              if echo "$RESP" | grep -q '"reason":"AlreadyExists"'; then
                curl -sk --cacert $CA \
                  -H "Authorization: Bearer $TOKEN" \
                  -H "Content-Type: application/strategic-merge-patch+json" \
                  -X PATCH \
                  "https://kubernetes.default.svc/api/v1/namespaces/${NAMESPACE}/configmaps/invenio-debug-output" \
                  -d "{\"data\":{\"output\":${ESCAPED}}}" > /dev/null
                echo "ConfigMap updated (patched)"
              else
                echo "$RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print('ConfigMap created:', d.get('metadata',{}).get('name','?'))" 2>/dev/null || echo "ConfigMap write response: $RESP"
              fi
              echo "=== Output saved to ConfigMap invenio-debug-output ==="
          envFrom:
            - configMapRef:
                name: invenio-app-config
            - secretRef:
                name: invenio-app-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
