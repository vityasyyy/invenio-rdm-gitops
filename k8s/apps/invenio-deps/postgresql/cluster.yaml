# CloudNativePG Cluster for InvenioRDM
# Single-instance cluster for development/small-scale production.
# Scaled down to 1 for single-node recovery; increase when nodes are added.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  namespace: database
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:16.4

  postgresql:
    pg_hba:
      # Allow md5 authentication from all cluster pods (simplifies cross-namespace access)
      - host all all all md5

  storage:
    size: 10Gi
    storageClass: btd-nfs

  bootstrap:
    initdb:
      database: invenio
      owner: invenio
      secret:
        name: postgres-invenio-app-user

  # Backup configuration: WAL archive to existing MinIO
  backup:
    retentionPolicy: "30d"
    barmanObjectStore:
      destinationPath: "s3://invenio-rdm-backups/postgres"
      endpointURL: "http://minio.minio.svc.cluster.local:9000"
      s3Credentials:
        accessKeyId:
          name: minio-credentials
          key: rootUser
        secretAccessKey:
          name: minio-credentials
          key: rootPassword
      wal:
        compression: gzip

  monitoring:
    # Operator-created PodMonitor intentionally OFF (issue #105): the Cluster
    # CRD offers no podMonitorLabels field, so the operator object cannot carry
    # the `release: monitoring` label our Prometheus podMonitorSelector requires;
    # upstream CNPG 1.25 deprecates this field in favour of a manually managed
    # PodMonitor (see postgres-podmonitor.yaml in this kustomization).
    enablePodMonitor: false
    customQueriesConfigMap:
      - name: cnpg-default-monitoring
        key: queries
---
# Scheduled daily backup at 02:00
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: postgres-daily-backup
  namespace: database
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  schedule: "0 2 * * *"
  backupOwnerReference: self
  cluster:
    name: postgres
