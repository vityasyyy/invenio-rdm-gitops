# CloudNativePG Cluster for InvenioRDM
# Single-instance cluster for development/small-scale production.
# Scaled down to 1 for single-node recovery; increase when nodes are added.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  namespace: database
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:16.4

  postgresql:
    pg_hba:
      # Allow md5 authentication from all cluster pods (simplifies cross-namespace access)
      - host all all all md5

  storage:
    size: 10Gi
    storageClass: btd-nfs

  bootstrap:
    initdb:
      database: invenio
      owner: invenio
      secret:
        name: postgres-invenio-app-user

  # Backup configuration: WAL archive to existing MinIO
  backup:
    # Keep 30 days until an isolated restore drill verifies the base-backup/WAL chain.
    retentionPolicy: "30d"
    barmanObjectStore:
      destinationPath: "s3://invenio-rdm-backups/postgres"
      endpointURL: "http://minio.minio.svc.cluster.local:9000"
      s3Credentials:
        accessKeyId:
          name: minio-credentials
          key: rootUser
        secretAccessKey:
          name: minio-credentials
          key: rootPassword
      wal:
        compression: gzip

  monitoring:
    # NOTE: no enablePodMonitor field by design (issue #112). Setting it kept
    # this app OutOfSync (live object carries no such stanza), and scraping is
    # covered by the manually managed postgres-metrics PodMonitor in this
    # kustomization instead.
    customQueriesConfigMap:
      - name: cnpg-default-monitoring
        key: queries
---
# Daily backup at 02:00 UTC. CloudNativePG cron has six fields (seconds first);
# a five-field expression runs hourly at the second-field minute.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: postgres-daily-backup
  namespace: database
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  schedule: "0 0 2 * * *"
  backupOwnerReference: self
  cluster:
    name: postgres
