clusterName: opensearch-cluster
nodeGroup: master
replicas: 1
singleNode: true
config:
  opensearch.yml: |
    cluster.name: opensearch-cluster
    network.host: 0.0.0.0
    plugins.security.disabled: true
resources:
  limits:
    cpu: 1000m
    memory: 2Gi
  requests:
    cpu: 250m
    memory: 512Mi
persistence:
  enabled: true
  storageClass: btd-nfs
  size: 10Gi
securityContext:
  runAsUser: 1000
  runAsGroup: 1000
roles:
  - master
  - ingest
  - data
plugins:
  enabled: true
  installList:
    - https://github.com/opensearch-project/opensearch-prometheus-exporter/releases/download/2.19.1.0/prometheus-exporter-2.19.1.0.zip
serviceMonitor:
  # The local ServiceMonitor keeps the existing identity and drops headless duplicates.
  enabled: false
