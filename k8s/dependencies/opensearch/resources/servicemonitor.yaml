apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: opensearch-cluster-master-service-monitor
  namespace: search
  labels:
    release: monitoring
    app.kubernetes.io/name: opensearch
    app.kubernetes.io/instance: invenio-opensearch
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: opensearch
      app.kubernetes.io/instance: invenio-opensearch
  endpoints:
    - port: http
      path: /_prometheus/metrics
      scheme: http
      interval: 30s
      relabelings:
        - sourceLabels: [__meta_kubernetes_service_name]
          action: keep
          regex: opensearch-cluster-master
