apiVersion: batch/v1
kind: Job
metadata:
  name: monitoring-pipecheck
  namespace: monitoring
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: monitoring-pipecheck
        app.kubernetes.io/part-of: monitoring
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pipecheck
          image: curlimages/curl:8.22.0@sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c", "set -e\nPROM=http://monitoring-kube-prometheus-prometheus.monitoring.svc:9090\nAM=http://monitoring-kube-prometheus-alertmanager.monitoring.svc:9093\ncurl -sf $PROM/-/ready >/dev/null && echo 'prometheus ready'\ncurl -sf $AM/-/ready >/dev/null && echo 'alertmanager ready'\nNOW=$(date -u +%FT%TZ)\nprintf '[{\"labels\":{\"alertname\":\"MonitoringPipeTest\",\"severity\":\"info\"},\"annotations\":{\"summary\":\"Pipecheck test alert — safe to resolve\"},\"startsAt\":\"%s\",\"endsAt\":\"2099-01-01T00:00:00Z\"}]' \"$NOW\" > /tmp/test-alert.json\ncurl -sf -XPOST -H 'Content-Type: application/json' --data @/tmp/test-alert.json $AM/api/v2/alerts && echo 'test alert accepted'"]
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile: {type: RuntimeDefault}
