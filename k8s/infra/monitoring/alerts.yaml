apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cluster-health-alerts
  namespace: monitoring
  labels:
    release: monitoring
  annotations:
    argocd.argoproj.io/sync-options: Replace=true
spec:
  groups:
    - name: app-slo
      rules:
        - alert: InvenioWebReplicasUnavailable
          expr: |
            kube_deployment_status_replicas_available{
              namespace="invenio",deployment="invenio-web"
            } < kube_deployment_spec_replicas{
              namespace="invenio",deployment="invenio-web"
            }
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "Invenio web replicas unavailable"
            description: "invenio/invenio-web has fewer available replicas than desired for more than 10m. Deposits and search may be degraded."
            runbook_url: "https://github.com/vityasyyy/invenio-rdm-gitops/blob/main/README.md#incident-triage"
            dashboard: "https://grafana.vityasy.me/d/invenio-app"
        - alert: Invenio5xxRatioHigh
          expr: |
            100 * (
              sum(rate(
                traefik_service_requests_total{
                  service=~"invenio-web.*",code=~"5.."
                }[10m]
              )) / clamp_min(
                sum(rate(
                  traefik_service_requests_total{
                    service=~"invenio-web.*"
                  }[10m]
                )), 0.001
              )
            ) > 2
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Invenio 5xx ratio is high"
            description: "Traefik reports more than 2% 5xx responses for invenio-web over the last 10m."
            runbook_url: "https://github.com/vityasyyy/invenio-rdm-gitops/blob/main/README.md#incident-triage"
            dashboard: "https://grafana.vityasy.me/d/invenio-app"
        - alert: TraefikServiceDown
          expr: |
            count(traefik_service_server_up) by (service) == 0
            and on(service) count(traefik_service_requests_total) by (service) > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Traefik backend {{ $labels.service }} has no healthy servers"
            description: "All backend servers for this Traefik service are down while it still receives traffic."
            runbook_url: "https://github.com/vityasyyy/invenio-rdm-gitops/blob/main/README.md#incident-triage"
            dashboard: "https://grafana.vityasy.me/d/overview-invenio-rdm"
        - alert: InvenioPodRestartHigh
          expr: |
            sum(increase(
              kube_pod_container_status_restarts_total{namespace="invenio"}[1h]
            )) > 5
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Invenio pod restarts are elevated"
            description: "Invenio pods restarted more than 5 times in the last hour. Check crash causes before it becomes an outage."
            runbook_url: "https://github.com/vityasyyy/invenio-rdm-gitops/blob/main/README.md#incident-triage"
            dashboard: "https://grafana.vityasy.me/d/invenio-app"
    - name: data-backups
      rules:
        - alert: VeleroBackupFailed
          expr: |
            sum(increase(velero_backup_failure_total[1h])) > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Velero backup failed"
            description: "At least one Velero backup failed in the last hour. Check velero backup logs; cluster disaster recovery is at risk."
            runbook_url: "https://github.com/vityasyyy/invenio-rdm-gitops/blob/main/README.md#backup--restore"
            dashboard: "https://grafana.vityasy.me/d/data-backups"
        - alert: VeleroBackupMetricsMissing
          expr: |
            absent(count(kube_customresource_velero_schedule_status_last_backup_timestamp{
              schedule="weekly-infra-backup"
            }))
            or absent(count(velero_backup_last_successful_timestamp))
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "Required Velero backup metrics are missing"
            description: "Prometheus has not collected the required weekly schedule's last-attempt timestamp or Velero's scrape metrics for 10m. Required backup freshness cannot be verified."
            runbook_url: "https://github.com/vityasyyy/invenio-rdm-gitops/blob/main/README.md#backup--restore"
            dashboard: "https://grafana.vityasy.me/d/data-backups"
        - alert: VeleroBackupNeverSucceeded
          expr: |
            absent(count(kube_customresource_velero_backup_completion_timestamp{
              scope="infra-and-invenio",phase="Completed"
            }))
            or
            max(kube_customresource_velero_schedule_status_last_backup_timestamp{
              schedule="weekly-infra-backup"
            }) == 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "Required production backup coverage is missing"
            description: "No Completed production-scope backup has a completion timestamp, or the required weekly schedule reports lastBackup=0. A fresh canary or unlabelled backup does not prove production coverage. Verify scope labels, the Schedule, Velero logs, and storage."
            runbook_url: "https://github.com/vityasyyy/invenio-rdm-gitops/blob/main/README.md#backup--restore"
            dashboard: "https://grafana.vityasy.me/d/data-backups"
        - alert: VeleroScheduledBackupOverdue
          expr: |
            max(kube_customresource_velero_schedule_status_last_backup_timestamp{
              schedule="weekly-infra-backup"
            }) > 0
            and (
              time() - max(kube_customresource_velero_schedule_status_last_backup_timestamp{
                schedule="weekly-infra-backup"
              }) > 8 * 24 * 3600
            )
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Required weekly Velero schedule is overdue"
            description: "The required weekly schedule has not started a run for more than 8 days. Fresh manual production coverage does not prove the schedule is executing. Verify the Schedule and Velero logs."
            runbook_url: "https://github.com/vityasyyy/invenio-rdm-gitops/blob/main/README.md#backup--restore"
            dashboard: "https://grafana.vityasy.me/d/data-backups"
        - alert: VeleroBackupStale
          expr: |
            (time() - topk(1, kube_customresource_velero_backup_completion_timestamp{
              scope="infra-and-invenio",phase="Completed"
            })) > 8 * 24 * 3600
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Production backup coverage is over 8 days old"
            description: "The newest Completed production-scope Velero Backup completed more than 8 days ago. CR resync or a fresh canary backup cannot satisfy production coverage; verify the backup schedule and storage."
            runbook_url: "https://github.com/vityasyyy/invenio-rdm-gitops/blob/main/README.md#backup--restore"
            dashboard: "https://grafana.vityasy.me/d/data-backups"
        - alert: VeleroScheduledBackupFailed
          expr: |
            max by (schedule) (
              (
                abs(
                  kube_customresource_velero_backup_start_timestamp{
                    backup=~"weekly-infra-backup-[0-9]{14}",
                    schedule="weekly-infra-backup",
                    scope="infra-and-invenio",
                    phase=~"PartiallyFailed|Failed|FailedValidation"
                  }
                  - on (schedule) group_left()
                  kube_customresource_velero_schedule_status_last_backup_timestamp{
                    schedule="weekly-infra-backup"
                  }
                ) <= 300
              )
              or
              (
                (
                  kube_customresource_velero_schedule_status_last_backup_timestamp{
                    schedule="weekly-infra-backup"
                  } > 0
                  unless on (schedule)
                  (
                    abs(
                      kube_customresource_velero_backup_start_timestamp{
                        backup=~"weekly-infra-backup-[0-9]{14}",
                        schedule="weekly-infra-backup",
                        scope="infra-and-invenio",
                        phase="Completed"
                      }
                      - on (schedule) group_left()
                      kube_customresource_velero_schedule_status_last_backup_timestamp{
                        schedule="weekly-infra-backup"
                      }
                    ) <= 300
                  )
                )
                and on (schedule)
                (
                  (time() - kube_customresource_velero_schedule_status_last_backup_timestamp{
                    schedule="weekly-infra-backup"
                  }) > 4 * 3600
                )
              )
            )
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Required weekly Velero schedule did not complete"
            description: "The latest actual weekly schedule run ended in a terminal failure, or has no Completed generated backup 4h after starting. Manual and canary backups do not satisfy this schedule. Inspect the Backup and Velero logs."
            runbook_url: "https://github.com/vityasyyy/invenio-rdm-gitops/blob/main/README.md#backup--restore"
            dashboard: "https://grafana.vityasy.me/d/data-backups"
        - alert: PostgreSQLHighConnections
          expr: cnpg_collection_connections_total / cnpg_collection_connections_max > 0.8
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "PostgreSQL connection usage above 80%"
            description: "Cluster {{ $labels.cluster_name }} is using more than 80% of available connections. Scale the pool or investigate leaks."
            runbook_url: "https://github.com/vityasyyy/invenio-rdm-gitops/blob/main/README.md#backup--restore"
            dashboard: "https://grafana.vityasy.me/d/data-backups"
        - alert: CNPGReplicationLagHigh
          expr: cnpg_collection_replication_lag > 30
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "PostgreSQL replication lag is high"
            description: "Cluster {{ $labels.cluster_name }} has replication lag above 30 seconds."
            runbook_url: "https://github.com/vityasyyy/invenio-rdm-gitops/blob/main/README.md#backup--restore"
            dashboard: "https://grafana.vityasy.me/d/data-backups"
        - alert: CNPGBackupStale
          expr: |
            cnpg_collector_last_available_backup_timestamp > 0
            and (time() - cnpg_collector_last_available_backup_timestamp) > 26 * 3600
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "No CNPG backup in over 26 hours"
            description: "The last available CloudNativePG backup is older than 26h (daily schedule + 2h grace). Point-in-time recovery coverage has a gap."
            runbook_url: "https://github.com/vityasyyy/invenio-rdm-gitops/blob/main/README.md#backup--restore"
            dashboard: "https://grafana.vityasy.me/d/data-backups"
        - alert: CNPGArchivingDown
          expr: |
            cnpg_collector_pg_wal_archive_status{value="ready"} > 5
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "CNPG WAL archiving is falling behind"
            description: "More than 5 WAL segments are waiting to be archived for 15m. Continuous archiving may be broken; point-in-time recovery is at risk."
            runbook_url: "https://github.com/vityasyyy/invenio-rdm-gitops/blob/main/README.md#backup--restore"
            dashboard: "https://grafana.vityasy.me/d/data-backups"
        - alert: VeleroPluginCrashlooping
          expr: |
            sum(rate(
              kube_pod_container_status_restarts_total{namespace="velero"}[15m]
            )) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Velero pods are restarting"
            description: "Velero containers restarted in the last 15m (plugin crashloop class, see issue #91). Backups may silently stop."
            runbook_url: "https://github.com/vityasyyy/invenio-rdm-gitops/blob/main/README.md#backup--restore"
            dashboard: "https://grafana.vityasy.me/d/data-backups"
    - name: capacity
      rules:
        - alert: HighMemoryUsage
          expr: (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) < 0.1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Node memory available below 10%"
            description: "A node has less than 10% memory available. Add headroom or evict before the kernel OOM-killer decides."
            runbook_url: "https://github.com/vityasyyy/invenio-rdm-gitops/blob/main/README.md#incident-triage"
            dashboard: "https://grafana.vityasy.me/d/platform-health"
        - alert: NodeDiskPressure
          expr: kube_node_status_condition{condition="DiskPressure",status="true"} == 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Node {{ $labels.node }} is under disk pressure"
            description: "kubelet reports DiskPressure on this node. Pods will be evicted; free disk or expand the volume."
            runbook_url: "https://github.com/vityasyyy/invenio-rdm-gitops/blob/main/README.md#incident-triage"
            dashboard: "https://grafana.vityasy.me/d/platform-health"
        - alert: PodNotReady
          expr: |
            max by (namespace, pod) (
              kube_pod_status_ready{condition="true"} == 0
            )
            and on (namespace, pod)
            max by (namespace, pod) (
              kube_pod_status_phase{phase=~"Pending|Running"} == 1
            )
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is not ready"
            description: >-
              The pod has remained Pending or not Ready for 10m. Check scheduling, events, and container readiness.
            runbook_url: "https://github.com/vityasyyy/invenio-rdm-gitops/blob/main/README.md#incident-triage"
            dashboard: "https://grafana.vityasy.me/d/platform-health"
        - alert: InvenioPVCUsageHigh
          expr: |
            100 * (
              1 - (
                sum(kubelet_volume_stats_available_bytes{namespace="invenio"}) /
                clamp_min(
                  sum(kubelet_volume_stats_capacity_bytes{namespace="invenio"}), 1
                )
              )
            ) > 80
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Invenio PVC usage is high"
            description: "Persistent volume usage in namespace invenio is above 80%. Expand the claim before writes fail."
            runbook_url: "https://github.com/vityasyyy/invenio-rdm-gitops/blob/main/README.md#incident-triage"
            dashboard: "https://grafana.vityasy.me/d/overview-invenio-rdm"
        - alert: OOMKillsIncreasing
          expr: |
            sum(rate(
              kube_pod_container_status_terminated_reason{reason="OOMKilled"}[30m]
            )) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Containers are being OOM-killed"
            description: "At least one container was OOM-killed in the last 30m. Raise the memory limit or fix the leak."
            runbook_url: "https://github.com/vityasyyy/invenio-rdm-gitops/blob/main/README.md#incident-triage"
            dashboard: "https://grafana.vityasy.me/d/platform-health"
        - alert: PodCrashLoopingWithDown
          expr: |
            max by (namespace, pod) (
              max_over_time(
                kube_pod_container_status_waiting_reason{
                  reason="CrashLoopBackOff"
                }[5m]
              )
            ) == 1
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is crash looping"
            description: >-
              A container has remained in CrashLoopBackOff. Check its logs, events, and
              resource limits to identify the crash cause.
            runbook_url: "https://github.com/vityasyyy/invenio-rdm-gitops/blob/main/README.md#incident-triage"
            dashboard: "https://grafana.vityasy.me/d/platform-health"
    - name: edge
      rules:
        - alert: CloudflareTunnelDown
          expr: up{job=~".*cloudflared.*"} == 0
          for: 3m
          labels:
            severity: critical
          annotations:
            summary: "Cloudflare tunnel is down"
            description: "cloudflared is not reporting as up. External access is likely broken; check the tunnel pod, IngressRoute, and network policies."
            runbook_url: "https://github.com/vityasyyy/invenio-rdm-gitops/blob/main/README.md#incident-triage"
            dashboard: "https://grafana.vityasy.me/d/overview-invenio-rdm"
        - alert: TraefikHigh404Rate
          expr: |
            100 * (
              sum(rate(traefik_service_requests_total{code="404"}[5m])) /
              clamp_min(sum(rate(traefik_service_requests_total[5m])), 0.001)
            ) > 5
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Traefik 404 rate is above 5%"
            description: "High proportion of 404 responses from Traefik. Check IngressRoute, network policies, and service endpoints."
            runbook_url: "https://github.com/vityasyyy/invenio-rdm-gitops/blob/main/README.md#incident-triage"
            dashboard: "https://grafana.vityasy.me/d/overview-invenio-rdm"
    - name: platform-self
      rules:
        - alert: PrometheusTargetDown
          expr: count(up == 0) / count(up) > 0.1
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "More than 10% of Prometheus targets are down"
            description: "Over 10% of scrape targets are down for 10m. Monitoring itself has a blind spot; fix scraping before trusting dashboards."
            runbook_url: "https://github.com/vityasyyy/invenio-rdm-gitops/blob/main/docs/plans/active/2026-09-08-monitoring-overhaul.md"
            dashboard: "https://grafana.vityasy.me/d/platform-health"
        - alert: KubeStateMetricsDown
          expr: up{job=~".*kube-state-metrics.*"} == 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "kube-state-metrics is down"
            description: "kube-state-metrics is not being scraped. Most Kubernetes-state alerts and panels are blind until it recovers."
            runbook_url: "https://github.com/vityasyyy/invenio-rdm-gitops/blob/main/docs/plans/active/2026-09-08-monitoring-overhaul.md"
            dashboard: "https://grafana.vityasy.me/d/platform-health"
        - alert: AlertmanagerNotificationsFailing
          expr: sum(rate(alertmanager_notifications_failed_total[10m])) > 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "Alertmanager notifications are failing"
            description: "Alertmanager failed to deliver notifications in the last 10m. Discord delivery may be broken; check the Alertmanager logs and webhook secret."
            runbook_url: "https://github.com/vityasyyy/invenio-rdm-gitops/blob/main/docs/plans/active/2026-09-08-monitoring-overhaul.md"
            dashboard: "https://grafana.vityasy.me/d/platform-health"
        - alert: AlertmanagerConfigFailed
          expr: alertmanager_config_last_reload_successful == 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "Alertmanager configuration failed to reload"
            description: "The last Alertmanager configuration reload failed. Routing changes are not active; fix the config and check the operator logs."
            runbook_url: "https://github.com/vityasyyy/invenio-rdm-gitops/blob/main/docs/plans/active/2026-09-08-monitoring-overhaul.md"
            dashboard: "https://grafana.vityasy.me/d/platform-health"
