apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: discord-receivers
  namespace: monitoring
spec:
  # Self-contained tier routing (Branch A). The operator appends this route as
  # a first-level child of the base root; with alertmanagerConfigMatcherStrategy
  # None (see values.yaml) it applies cluster-wide, not just namespace monitoring.
  # CRD camelCase: groupBy/groupWait/groupInterval/repeatInterval/matchers.
  # NOTE: Watchdog/InfoInhibitor heartbeat routes to the empty `blackhole`
  # receiver below (issue #123) — named to avoid colliding with the base
  # Secret's `null` receiver (duplicate names are invalid). Both carry severity `none`, which matches
  # neither tier sub-route — but the CR root route itself has no matchers, so
  # without explicit blackhole routes they land in discord-warning (proven live:
  # InfoInhibitor reached Discord 2026-09-15). The #111 fall-through-to-base
  # theory was wrong: the CR root receiver catches everything first.
  route:
    receiver: discord-warning
    groupBy: ["alertname", "namespace", "service"]
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 4h
    routes:
      - receiver: blackhole
        matchers:
          - name: alertname
            value: Watchdog
        continue: false
      - receiver: blackhole
        matchers:
          - name: alertname
            value: InfoInhibitor
        continue: false
      - receiver: discord-critical
        matchers:
          - name: severity
            value: critical
        repeatInterval: 2h
        continue: false
      - receiver: discord-warning
        matchers:
          - name: severity
            value: warning
        repeatInterval: 12h
        continue: false
  receivers:
    - name: blackhole
    - name: discord-critical
      discordConfigs:
        - apiURL:
            name: alertmanager-discord-webhook
            key: DISCORD_WEBHOOK_URL
          title: '[CRITICAL] {{ .GroupLabels.alertname }}'
          message: '{{ range .Alerts }}{{ .Annotations.summary }}\n{{ .Annotations.description }}{{ with .Annotations.runbook_url }}\nRunbook: {{ . }}{{ end }}{{ with .Annotations.dashboard }}\nDashboard: {{ . }}{{ end }}\n{{ end }}'
          sendResolved: true
    - name: discord-warning
      discordConfigs:
        - apiURL:
            name: alertmanager-discord-webhook
            key: DISCORD_WEBHOOK_URL
          title: '[WARNING] {{ .GroupLabels.alertname }}'
          message: '{{ range .Alerts }}{{ .Annotations.summary }}\n{{ .Annotations.description }}{{ with .Annotations.runbook_url }}\nRunbook: {{ . }}{{ end }}{{ with .Annotations.dashboard }}\nDashboard: {{ . }}{{ end }}\n{{ end }}'
          sendResolved: true
