apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: discord-receivers
  namespace: monitoring
spec:
  # Self-contained tier routing (Branch A). The operator appends this route as
  # a first-level child of the base root; with alertmanagerConfigMatcherStrategy
  # None (see values.yaml) it applies cluster-wide, not just namespace monitoring.
  # CRD camelCase: groupBy/groupWait/groupInterval/repeatInterval/matchers.
  # NOTE: no Watchdog heartbeat route by design (issue #110). A heartbeat to a
  # human channel trains muting and proves nothing that NotificationsFailing,
  # the pipecheck hook, and up-based target alerts don't cover better. Watchdog
  # falls through to the base root receiver (null).
  route:
    receiver: discord-warning
    groupBy: ["alertname", "namespace", "service"]
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 4h
    routes:
      - receiver: discord-critical
        matchers:
          - name: severity
            value: critical
        repeatInterval: 2h
        continue: false
      - receiver: discord-warning
        matchers:
          - name: severity
            value: warning
        repeatInterval: 12h
        continue: false
  receivers:
    - name: discord-critical
      discordConfigs:
        - apiURL:
            name: alertmanager-discord-webhook
            key: DISCORD_WEBHOOK_URL
          title: '[CRITICAL] {{ .GroupLabels.alertname }}'
          message: '{{ range .Alerts }}{{ .Annotations.summary }}\n{{ .Annotations.description }}{{ with .Annotations.runbook_url }}\nRunbook: {{ . }}{{ end }}{{ with .Annotations.dashboard }}\nDashboard: {{ . }}{{ end }}\n{{ end }}'
          sendResolved: true
    - name: discord-warning
      discordConfigs:
        - apiURL:
            name: alertmanager-discord-webhook
            key: DISCORD_WEBHOOK_URL
          title: '[WARNING] {{ .GroupLabels.alertname }}'
          message: '{{ range .Alerts }}{{ .Annotations.summary }}\n{{ .Annotations.description }}{{ with .Annotations.runbook_url }}\nRunbook: {{ . }}{{ end }}{{ with .Annotations.dashboard }}\nDashboard: {{ . }}{{ end }}\n{{ end }}'
          sendResolved: true
