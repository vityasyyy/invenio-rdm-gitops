rule_files: []
evaluation_interval: 5m

tests:
  - name: fresh canary cannot clear stale production coverage
    interval: 5m
    input_series:
      - series: 'kube_customresource_velero_backup_completion_timestamp{backup="recovery-production-20261018",scope="infra-and-invenio",phase="Completed"}'
        values: '1+0x2400'
      - series: 'velero_backup_last_successful_timestamp{schedule=""}'
        values: '1792403166+0x2400'
    alert_rule_test:
      - eval_time: 200h
        alertname: VeleroBackupStale
        exp_alerts:
          - exp_labels:
              backup: recovery-production-20261018
              phase: Completed
              scope: infra-and-invenio
              severity: warning
            exp_annotations:
              summary: "Production backup coverage is over 8 days old"
              description: "The newest Completed production-scope Velero Backup completed more than 8 days ago. CR resync or a fresh canary backup cannot satisfy production coverage; verify the backup schedule and storage."
              runbook_url: "https://github.com/vityasyyy/invenio-rdm-gitops/blob/main/README.md#backup--restore"
              dashboard: "https://grafana.vityasy.me/d/data-backups"

  - name: manual production success does not hide a failed weekly run
    interval: 5m
    input_series:
      - series: 'kube_customresource_velero_backup_completion_timestamp{backup="recovery-production-20261019",schedule="weekly-infra-backup",scope="infra-and-invenio",phase="Completed"}'
        values: '1000+0x400'
      - series: 'kube_customresource_velero_backup_start_timestamp{backup="weekly-infra-backup-19700101001645",schedule="weekly-infra-backup",scope="infra-and-invenio",phase="PartiallyFailed"}'
        values: '1005+0x400'
      - series: 'kube_customresource_velero_schedule_status_last_backup_timestamp{schedule="weekly-infra-backup"}'
        values: '1000+0x400'
      - series: 'velero_backup_last_successful_timestamp{schedule=""}'
        values: '1792403166+0x400'
    alert_rule_test:
      - eval_time: 1h
        alertname: VeleroScheduledBackupFailed
        exp_alerts:
          - exp_labels:
              schedule: weekly-infra-backup
              severity: critical
            exp_annotations:
              summary: "Required weekly Velero schedule did not complete"
              description: "The latest actual weekly schedule run ended in a terminal failure, or has no Completed generated backup 4h after starting. Manual and canary backups do not satisfy this schedule. Inspect the Backup and Velero logs."
              runbook_url: "https://github.com/vityasyyy/invenio-rdm-gitops/blob/main/README.md#backup--restore"
              dashboard: "https://grafana.vityasy.me/d/data-backups"
      - eval_time: 1h
        alertname: VeleroBackupStale
        exp_alerts: []

  - name: completed weekly run and fresh production coverage stay quiet
    interval: 5m
    input_series:
      - series: 'kube_customresource_velero_backup_completion_timestamp{backup="recovery-production-20261019",schedule="weekly-infra-backup",scope="infra-and-invenio",phase="Completed"}'
        values: '1000+0x400'
      - series: 'kube_customresource_velero_backup_start_timestamp{backup="weekly-infra-backup-19700101001645",schedule="weekly-infra-backup",scope="infra-and-invenio",phase="Completed"}'
        values: '1005+0x400'
      - series: 'kube_customresource_velero_schedule_status_last_backup_timestamp{schedule="weekly-infra-backup"}'
        values: '1000+0x400'
      - series: 'velero_backup_last_successful_timestamp{schedule="weekly-infra-backup"}'
        values: '1000+0x400'
    alert_rule_test:
      - eval_time: 1h
        alertname: VeleroScheduledBackupFailed
        exp_alerts: []
      - eval_time: 1h
        alertname: VeleroBackupStale
        exp_alerts: []
      - eval_time: 1h
        alertname: VeleroBackupNeverSucceeded
        exp_alerts: []
      - eval_time: 1h
        alertname: VeleroBackupMetricsMissing
        exp_alerts: []

  - name: required metrics absent despite a healthy scrape target
    interval: 5m
    input_series:
      - series: 'up{job="velero"}'
        values: '1+0x10'
    alert_rule_test:
      - eval_time: 20m
        alertname: VeleroBackupMetricsMissing
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "Required Velero backup metrics are missing"
              description: "Prometheus has not collected the required weekly schedule's last-attempt timestamp or Velero's scrape metrics for 10m. Required backup freshness cannot be verified."
              runbook_url: "https://github.com/vityasyyy/invenio-rdm-gitops/blob/main/README.md#backup--restore"
              dashboard: "https://grafana.vityasy.me/d/data-backups"
      - eval_time: 20m
        alertname: VeleroScheduledBackupFailed
        exp_alerts: []

  - name: never-run schedule fires despite fresh manual coverage
    interval: 5m
    input_series:
      - series: 'kube_customresource_velero_schedule_status_last_backup_timestamp{schedule="weekly-infra-backup"}'
        values: '0+0x400'
      - series: 'kube_customresource_velero_backup_completion_timestamp{backup="recovery-production-20261019",schedule="weekly-infra-backup",scope="infra-and-invenio",phase="Completed"}'
        values: '1000+0x400'
    alert_rule_test:
      - eval_time: 1h
        alertname: VeleroBackupNeverSucceeded
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "Required production backup coverage is missing"
              description: "No Completed production-scope backup has a completion timestamp, or the required weekly schedule reports lastBackup=0. A fresh canary or unlabelled backup does not prove production coverage. Verify scope labels, the Schedule, Velero logs, and storage."
              runbook_url: "https://github.com/vityasyyy/invenio-rdm-gitops/blob/main/README.md#backup--restore"
              dashboard: "https://grafana.vityasy.me/d/data-backups"
      - eval_time: 1h
        alertname: VeleroScheduledBackupFailed
        exp_alerts: []
      - eval_time: 1h
        alertname: VeleroScheduledBackupOverdue
        exp_alerts: []

  - name: overdue schedule fires despite fresh manual coverage
    interval: 5m
    input_series:
      - series: 'kube_customresource_velero_schedule_status_last_backup_timestamp{schedule="weekly-infra-backup"}'
        values: '1+0x2400'
      - series: 'kube_customresource_velero_backup_completion_timestamp{backup="recovery-production-20261019",schedule="weekly-infra-backup",scope="infra-and-invenio",phase="Completed"}'
        values: '1792404241+0x2400'
      - series: 'kube_customresource_velero_backup_start_timestamp{backup="weekly-infra-backup-19700101000005",schedule="weekly-infra-backup",scope="infra-and-invenio",phase="Completed"}'
        values: '1+0x2400'
    alert_rule_test:
      - eval_time: 200h
        alertname: VeleroScheduledBackupOverdue
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "Required weekly Velero schedule is overdue"
              description: "The required weekly schedule has not started a run for more than 8 days. Fresh manual production coverage does not prove the schedule is executing. Verify the Schedule and Velero logs."
              runbook_url: "https://github.com/vityasyyy/invenio-rdm-gitops/blob/main/README.md#backup--restore"
              dashboard: "https://grafana.vityasy.me/d/data-backups"
      - eval_time: 200h
        alertname: VeleroBackupStale
        exp_alerts: []
      - eval_time: 200h
        alertname: VeleroScheduledBackupFailed
        exp_alerts: []

  - name: in-progress weekly run is quiet inside the four-hour budget
    interval: 5m
    input_series:
      - series: 'kube_customresource_velero_schedule_status_last_backup_timestamp{schedule="weekly-infra-backup"}'
        values: '1000+0x100'
      - series: 'kube_customresource_velero_backup_start_timestamp{backup="weekly-infra-backup-19700101001645",schedule="weekly-infra-backup",scope="infra-and-invenio",phase="InProgress"}'
        values: '1005+0x100'
    alert_rule_test:
      - eval_time: 1h
        alertname: VeleroScheduledBackupFailed
        exp_alerts: []
      - eval_time: 5h
        alertname: VeleroScheduledBackupFailed
        exp_alerts:
          - exp_labels:
              schedule: weekly-infra-backup
              severity: critical
            exp_annotations:
              summary: "Required weekly Velero schedule did not complete"
              description: "The latest actual weekly schedule run ended in a terminal failure, or has no Completed generated backup 4h after starting. Manual and canary backups do not satisfy this schedule. Inspect the Backup and Velero logs."
              runbook_url: "https://github.com/vityasyyy/invenio-rdm-gitops/blob/main/README.md#backup--restore"
              dashboard: "https://grafana.vityasy.me/d/data-backups"

  - name: healthy schedule and fresh canary cannot hide missing production coverage
    interval: 5m
    input_series:
      - series: 'kube_customresource_velero_schedule_status_last_backup_timestamp{schedule="weekly-infra-backup"}'
        values: '1000+0x400'
      - series: 'kube_customresource_velero_backup_start_timestamp{backup="weekly-infra-backup-19700101001645",schedule="weekly-infra-backup",scope="infra-and-invenio",phase="Completed"}'
        values: '1005+0x400'
      - series: 'velero_backup_last_successful_timestamp{schedule=""}'
        values: '1792403166+0x400'
    alert_rule_test:
      - eval_time: 1h
        alertname: VeleroBackupNeverSucceeded
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "Required production backup coverage is missing"
              description: "No Completed production-scope backup has a completion timestamp, or the required weekly schedule reports lastBackup=0. A fresh canary or unlabelled backup does not prove production coverage. Verify scope labels, the Schedule, Velero logs, and storage."
              runbook_url: "https://github.com/vityasyyy/invenio-rdm-gitops/blob/main/README.md#backup--restore"
              dashboard: "https://grafana.vityasy.me/d/data-backups"
      - eval_time: 1h
        alertname: VeleroBackupStale
        exp_alerts: []
      - eval_time: 1h
        alertname: VeleroBackupMetricsMissing
        exp_alerts: []

  - name: resynced old backup with recent CR creation stays stale
    interval: 5m
    input_series:
      - series: 'kube_customresource_velero_backup_completion_timestamp{backup="weekly-infra-backup-19700101000005",schedule="weekly-infra-backup",scope="infra-and-invenio",phase="Completed"}'
        values: '1+0x2400'
      - series: 'kube_customresource_velero_backup_creation_timestamp{backup="weekly-infra-backup-19700101000005",schedule="weekly-infra-backup",scope="infra-and-invenio",phase="Completed"}'
        values: '1792404241+0x2400'
      - series: 'kube_customresource_velero_backup_start_timestamp{backup="weekly-infra-backup-19700101000005",schedule="weekly-infra-backup",scope="infra-and-invenio",phase="Completed"}'
        values: '1+0x2400'
      - series: 'kube_customresource_velero_schedule_status_last_backup_timestamp{schedule="weekly-infra-backup"}'
        values: '1+0x2400'
      - series: 'velero_backup_last_successful_timestamp{schedule=""}'
        values: '1792403166+0x2400'
      - series: 'velero_backup_last_successful_timestamp{schedule="weekly-infra-backup"}'
        values: '1792404241+0x2400'
    alert_rule_test:
      - eval_time: 200h
        alertname: VeleroBackupStale
        exp_alerts:
          - exp_labels:
              backup: weekly-infra-backup-19700101000005
              phase: Completed
              schedule: weekly-infra-backup
              scope: infra-and-invenio
              severity: warning
            exp_annotations:
              summary: "Production backup coverage is over 8 days old"
              description: "The newest Completed production-scope Velero Backup completed more than 8 days ago. CR resync or a fresh canary backup cannot satisfy production coverage; verify the backup schedule and storage."
              runbook_url: "https://github.com/vityasyyy/invenio-rdm-gitops/blob/main/README.md#backup--restore"
              dashboard: "https://grafana.vityasy.me/d/data-backups"
      - eval_time: 200h
        alertname: VeleroScheduledBackupFailed
        exp_alerts: []
