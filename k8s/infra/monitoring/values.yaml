# Prometheus/Grafana Helm Values - Versioned Configuration
#
# Chart: kube-prometheus-stack v69.6.0
# Source: https://prometheus-community.github.io/helm-charts
#
# This file is the source of truth for Monitoring stack configuration.
# Any changes should be committed to Git.

# Prometheus configuration
prometheus:
  prometheusSpec:
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1024Mi
    retention: 7d
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: btd-nfs
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi

# Grafana configuration
grafana:
  # Do not deploy the chart-bundled dashboards (12x monitoring-kube-prometheus-*
  # noise next to our one InvenioRDM folder). Sidecar-discovered dashboards
  # (grafana-dashboards.yaml) are unaffected. Issue #102.
  defaultDashboardsEnabled: false
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  admin:
    existingSecret: "monitoring-grafana"
    userKey: admin-user
    passwordKey: admin-password
  persistence:
    enabled: true
    storageClassName: btd-nfs
    size: 2Gi
  securityContext:
    runAsNonRoot: true
    runAsUser: 472
    runAsGroup: 472
    fsGroup: 472
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  initChownData:
    enabled: false
  sidecar:
    # Shared resources for all grafana sidecar containers (dashboards,
    # datasources, alerts). Issue #74 Phase-2 row 7: 128Mi/1Gi (LimitRange)
    # -> 64Mi/128Mi memory-only; cpu stays LimitRange-filled. Observed ~15Mi
    # per sidecar (2026-09-06 top); 128Mi limit = 8x observed.
    resources:
      requests:
        memory: 64Mi
      limits:
        memory: 128Mi
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: monitoring
      folderAnnotation: grafana_folder
      provider:
        foldersFromFilesStructure: true
    providers:
      enabled: true

# Alertmanager configuration
alertmanager:
  enabled: true
  alertmanagerSpec:
    alertmanagerConfigSelector: {}
    # Branch-A requirement: the discord-receivers AlertmanagerConfig carries the
    # tier sub-routes for ALL namespaces. Default OnNamespace would inject a
    # namespace="monitoring" matcher on the CR route and drop every
    # cross-namespace alert, so matching must be cluster-wide (chart 69.6.0
    # CRD crd-alertmanagers.yaml: enum OnNamespace|None, default OnNamespace).
    alertmanagerConfigMatcherStrategy:
      type: None
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: btd-nfs
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 1Gi
  config:
    global:
      resolve_timeout: 5m
    route:
      # Root only. The base Secret must be valid standalone (Alertmanager
      # rejects undefined receivers), so tier sub-routes live in the
      # discord-receivers AlertmanagerConfig CR (spec.route), not here.
      group_by: ["alertname", "namespace", "service"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: "null"
    inhibit_rules:
      # matchers syntax (issue #105): the operator logs deprecation warnings
      # for source_match:/target_match_re: — source/target_matchers is the
      # supported form on Alertmanager v0.28.0 (chart 69.6.0 bundle).
      - source_matchers:
          - severity="critical"
        target_matchers:
          - severity=~"warning|info"
        equal: [alertname, namespace]
    receivers:
      - name: "null"

# Default alerting rules
defaultRules:
  create: true
  rules:
    etcd: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    kubeProxy: false
    kubeControllerManager: false

# Kube State Metrics
kubeStateMetrics:
  enabled: true

# Resources for the kube-state-metrics subchart Deployment.
# Issue #74 Phase-2 row 10: 128Mi/1Gi (LimitRange) -> 64Mi/64Mi memory-only;
# cpu stays LimitRange-filled. Observed 22-25Mi (2026-09-06 top); 64Mi = 2.6x.
kube-state-metrics:
  resources:
    requests:
      memory: 64Mi
    limits:
      memory: 64Mi

# Node Exporter
nodeExporter:
  enabled: true
  nodeAffinity: {}
  tolerations:
    - operator: Exists

# Resources for the prometheus-node-exporter subchart DaemonSet (both nodes).
# Issue #74 Phase-2 row 11: 128Mi/1Gi (LimitRange) -> 64Mi/64Mi memory-only;
# cpu stays LimitRange-filled. Observed 5Mi per node (2026-09-06 top); 64Mi = 12x.
prometheus-node-exporter:
  resources:
    requests:
      memory: 64Mi
    limits:
      memory: 64Mi

# Prometheus Operator - disable admission webhooks to prevent failing job
prometheusOperator:
  admissionWebhooks:
    enabled: false
    patch:
      enabled: false
  # Resources for the prometheus-operator Deployment.
  # Issue #74 Phase-2 row 9: 128Mi/1Gi (LimitRange) -> 64Mi/128Mi memory-only;
  # cpu stays LimitRange-filled. Observed 23Mi (2026-09-06 top); 128Mi = 5.6x.
  resources:
    requests:
      memory: 64Mi
    limits:
      memory: 128Mi
  # Config-reloader flags for prometheus + alertmanager pods (2 sidecars +
  # 2 init containers on worker-02). Issue #74 Phase-2 row 5: 128Mi/1Gi
  # (LimitRange) -> 64Mi/256Mi memory-only; cpu flags stay 0 (LimitRange fills
  # cpu). Rendered as --config-reloader-memory-request/limit operator flags.
  prometheusConfigReloader:
    resources:
      requests:
        memory: 64Mi
      limits:
        memory: 256Mi
