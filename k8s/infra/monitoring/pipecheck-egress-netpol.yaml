# Pipecheck egress: cluster DNS + Prometheus/Alertmanager probes.
#
# The pipecheck Job must resolve Service DNS (CoreDNS, kube-system) and reach
# Prometheus :9090 and Alertmanager :9093 in its own namespace. Namespace-wide
# DNS was repaired separately (monitoring-egress.yaml); same-namespace TCP has
# no general allow, so this scoped policy covers exactly the Job's needs
# (issue #107). Mirrors the alertmanager-egress pattern.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: monitoring-pipecheck-egress
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: monitoring-pipecheck
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - podSelector: {}
      ports:
        - port: 9090
          protocol: TCP
        - port: 9093
          protocol: TCP
