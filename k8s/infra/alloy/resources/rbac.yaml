apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: alloy-log-reader
  namespace: invenio
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: alloy-log-reader
  namespace: invenio
subjects:
  - kind: ServiceAccount
    name: alloy
    namespace: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: alloy-log-reader
