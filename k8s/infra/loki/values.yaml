# The chart defaults to SimpleScalable. With read/write/backend scaled to zero
# that renders no Loki backend at all, so select SingleBinary explicitly.
deploymentMode: SingleBinary

loki:
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  storageConfig:
    filesystem:
      chunks_directory: /var/loki/chunks
      rules_directory: /var/loki/rules
  auth_enabled: false
  analytic:
    reporting_enabled: false
  limits_config:
    retention_period: 168h
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h

singleBinary:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  persistence:
    enabled: true
    size: 10Gi
    storageClass: btd-nfs
    # Keep Loki data when the StatefulSet is deleted or scaled down.
    enableStatefulSetAutoDeletePVC: false

chunksCache:
  # The chart expects a camelCase MB value; snake_case `allocated_memory: 256Mi`
  # was ignored, so chart default 8192 rendered as `-m 8192`. 256 matches
  # the sized-down memcached container below. Render-proof: `-m 256`.
  allocatedMemory: 256
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

resultsCache:
  # The same snake_case key was ignored, so chart default 1024 rendered as
  # `-m 1024` and auto-sized memcached to 1229Mi/1229Mi. Now 256 to match.
  # Render-proof: `-m 256`.
  allocatedMemory: 256
  # Issue #74: explicit memcached resources replace the
  # allocatedMemory-derived 1229Mi/1229Mi auto-sizing. Memory-only (cpu stays
  # LimitRange-filled, untouched). Pod total: 512+64=576Mi req,
  # 1024+128=1152Mi lim. Observed 4Mi (2026-09-06 top).
  resources:
    requests:
      memory: 512Mi
    limits:
      memory: 1024Mi

# Shared exporter sidecar resources for both cache StatefulSets.
# Issue #74: 128Mi/1Gi (LimitRange) -> 64Mi/128Mi
# memory-only; cpu stays LimitRange-filled. Observed 3-4Mi (2026-09-06 top).
memcachedExporter:
  resources:
    requests:
      memory: 64Mi
    limits:
      memory: 128Mi

gateway:
  enabled: false

read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

monitoring:
  selfMonitoring:
    enabled: false
    grafana:
      dashboards:
        enabled: false

# Loki canary (DaemonSet, both workers). Issue #74:
# the block lived under `monitoring.lokiCanary` (dead — no chart template
# reads it; chart default enabled:true applied, hence 2 live canary pods
# despite "disabled"). Moved to the top-level schema key, keeping the live
# enabled state and bounding resources 128Mi/1Gi (LimitRange) -> 64Mi/64Mi
# memory-only; cpu stays LimitRange-filled. Observed 20Mi per pod
# (2026-09-06 top); 64Mi limit = 3.2x.
lokiCanary:
  enabled: true
  resources:
    requests:
      memory: 64Mi
    limits:
      memory: 64Mi

test:
  enabled: false
