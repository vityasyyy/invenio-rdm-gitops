# MinIO Helm Values - S3-Compatible Object Storage
#
# Chart: minio v5.4.0
# Source: https://charts.min.io/
#
# This file is the source of truth for MinIO configuration.
# Used by Velero as the S3-compatible backup storage backend.

mode: standalone

existingSecret: minio-credentials

buckets: []

# Issue #74 Phase-2 row 16: 256Mi/1Gi -> 256Mi/512Mi memory-only; cpu and
# requests untouched. Observed 250Mi (2026-09-06 top); 512Mi limit = 2.05x.
# NOTE: minio restarts on merge — lead-sequenced (DR-baseline timing).
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

persistence:
  enabled: true
  storageClass: btd-nfs
  size: 20Gi
  accessMode: ReadWriteOnce

securityContext:
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  runAsNonRoot: true

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

service:
  type: ClusterIP
  port: 9000

consoleService:
  type: ClusterIP
  port: 9001

job:
  enabled: false

postJob:
  enabled: false

metrics:
  serviceMonitor:
    enabled: true
    # includeNode renders the node-metrics ServiceMonitor (/minio/v2/metrics/node).
    # Without it the chart only renders a cluster-metrics Probe, which — like
    # the SM — carried release:minio labels and was never selected (issue #105).
    includeNode: true
    public: true
    interval: 30s
    scrapeTimeout: 10s
    additionalLabels:
      # Overrides the chart-default release:<release-name> label below (YAML
      # last-key-wins; render-proven) so Prometheus (selector release:
      # monitoring) actually selects this SM and the Probe.
      release: monitoring
