apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
data:
  "server.disable.auth": "false"
  "users.anonymous.enabled": "false"
  "statusbadge.enabled": "true"
  "account.anonymous.enabled": "false"
  "accounts.github-actions": "apiKey"
  "resource.exclusions": |
    - apiGroups:
      - velero.io
      kinds:
      - Backup
      - Restore
      clusters:
      - https://kubernetes.default.svc
      - https://10.43.0.1:443
  # Poll every 30s (supplements GitHub webhook for push-based sync)
  "timeout.reconciliation": "30s"
