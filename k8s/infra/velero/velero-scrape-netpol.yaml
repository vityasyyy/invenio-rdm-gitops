# Allow Prometheus scrapes of Velero :8085 (issue #112).
#
# Namespace `velero` otherwise only has default-deny-ingress; scrapes fail
# with `context deadline exceeded` (proven live via /api/v1/targets).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: velero-allow-monitoring-scrape
  namespace: velero
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: velero
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 8085
          protocol: TCP
