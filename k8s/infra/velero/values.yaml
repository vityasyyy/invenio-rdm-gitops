# Velero Helm Values - Versioned Configuration
#
# Chart: velero v11.4.0
# Source: https://vmware-tanzu.github.io/helm-charts
#
# This file is the source of truth for Velero configuration.
# Any changes should be committed to Git.

# Resource limits
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Enable metrics for Prometheus monitoring
metrics:
  enabled: true

# Disable volume snapshots - using file-level backup via restic instead
snapshotsEnabled: false

# Deploy node agent for backup/restore
deployNodeAgent: true

nodeAgent:
  # Explicit sizing so every daemonset pod is uniform; an unsized pod would
  # fall back to the namespace LimitRange defaults.
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
  # Data-mover pod sizing and concurrency; see node-agent-config.yaml.
  extraArgs:
    - --node-agent-configmap=node-agent-config

# Credentials for S3-compatible storage
credentials:
  useSecret: true
  existingSecret: velero-credentials

# Backup storage configuration - points to in-cluster MinIO
configuration:
  backupStorageLocation:
    - name: default
      provider: aws
      bucket: velero-backups
      config:
        region: minio
        s3ForcePathStyle: true
        s3Url: http://minio.minio.svc.cluster.local:9000
  # Repository-maintenance job budget. The chart renders this ConfigMap and
  # adds --repo-maintenance-job-configmap; pinning it in Git keeps the live
  # configuration reproducible. Memory request equals the limit so each job
  # reserves its full possible footprint before it is scheduled.
  repositoryMaintenanceJob:
    repositoryConfigData:
      name: velero-repo-maintenance
      global:
        keepLatestMaintenanceJobs: 3
        podResources:
          cpuRequest: "50m"
          cpuLimit: "250m"
          memoryRequest: "256Mi"
          memoryLimit: "256Mi"

# Init container for AWS plugin (needed for S3-compatible storage).
# Velero 1.17.x pairs with plugin 1.13.x per the upstream compatibility matrix.
initContainers:
  - name: velero-plugin-for-aws
    image: velero/velero-plugin-for-aws:v1.13.2
    imagePullPolicy: IfNotPresent
    volumeMounts:
      - mountPath: /target
        name: plugins
