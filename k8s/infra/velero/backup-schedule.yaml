# Velero backup schedule - weekly infrastructure backup
---
apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: weekly-infra-backup
  namespace: velero
  labels:
    backup-scope: infra-and-invenio
spec:
  schedule: "0 3 * * 0"
  template:
    ttl: 672h
    includedNamespaces:
      - argocd
      - traefik
      - monitoring
      - minio
      - invenio
      - database
      - redis
      - search
      - velero
      - cert-manager
    # Opt-in: only pods annotated with backup.velero.io/backup-volumes are
    # backed up at file-system level. Excluding the MinIO volume avoids
    # backing up the backup store into itself.
    defaultVolumesToFsBackup: false
    snapshotVolumes: false
    storageLocation: default
