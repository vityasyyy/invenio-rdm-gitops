apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-recovery-db-read
  namespace: minio
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: recovery-db-20261019
          podSelector:
            matchLabels:
              cnpg.io/cluster: postgres-recovery-drill
      ports:
        - protocol: TCP
          port: 9000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-operator-recovery-status
  namespace: database
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cloudnative-pg
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: recovery-db-20261019
          podSelector:
            matchLabels:
              cnpg.io/cluster: postgres-recovery-drill
      ports:
        - protocol: TCP
          port: 8000
