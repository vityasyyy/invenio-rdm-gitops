# Allow Prometheus scrapes of Traefik :9100/metrics (issue #117).
#
# Namespace `traefik` default-denies ingress; the wave-2 ServiceMonitor
# selects the dedicated `traefik-metrics` Service correctly, but packets die
# at the namespace boundary without this allow (proven live via
# /api/v1/targets: targets discovered, scrapes time out).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik-scrape-ingress
  namespace: traefik
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: traefik
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 9100
          protocol: TCP
