apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: invenio-postgresql
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "7"
spec:
  project: invenio
  sources:
    # Helm chart: CloudNativePG operator
    - chart: cloudnative-pg
      repoURL: https://cloudnative-pg.github.io/charts
      targetRevision: "0.23.0"
      helm:
        valueFiles:
          - $values/k8s/dependencies/postgresql/values.yaml
    # Raw manifests: namespace, cluster, netpols
    - repoURL: https://github.com/vityasyyy/invenio-rdm-gitops.git
      targetRevision: main
      ref: values
      path: k8s/dependencies/postgresql
  destination:
    server: https://kubernetes.default.svc
    namespace: database
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - PrunePropagationPolicy=foreground
