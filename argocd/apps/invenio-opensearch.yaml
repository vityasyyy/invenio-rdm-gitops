apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: invenio-opensearch
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "7"
spec:
  project: invenio
  sources:
    # Helm values and custom resources share the same Git source below.
    - chart: opensearch
      repoURL: https://opensearch-project.github.io/helm-charts/
      targetRevision: "2.32.0"
      helm:
        valueFiles:
          - $values/k8s/dependencies/opensearch/values.yaml
    # Raw manifests: namespace, netpols
    - repoURL: https://github.com/vityasyyy/invenio-rdm-gitops.git
      targetRevision: main
      ref: values
      path: k8s/dependencies/opensearch
  destination:
    server: https://kubernetes.default.svc
    namespace: search
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      jsonPointers:
        - /metadata/annotations
        - /spec/volumeClaimTemplates
        - /spec/template/metadata/annotations
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - PrunePropagationPolicy=foreground
