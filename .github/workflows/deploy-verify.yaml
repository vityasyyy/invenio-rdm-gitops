name: Deploy Verify

on:
  push:
    branches: [main]
    paths:
      - 'argocd/**'
      - 'k8s/**'
      - 'external-lb/**'
      - '.github/workflows/deploy-verify.yaml'
      - 'scripts/deployment-verifier.py'
      - 'scripts/tests/test_deployment_verifier.py'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  verify-argocd-sync:
    name: Verify ArgoCD Sync
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Verify revision, sync, health, operations, and hooks
        timeout-minutes: 16
        env:
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
        run: python3 -u scripts/deployment-verifier.py

      - name: Smoke test
        run: |
          set -euo pipefail

          echo "Running smoke test against InvenioRDM health endpoint..."
          HEALTH_URL="${HEALTH_URL:-https://invenio.vityasy.me/ping}"
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            --connect-timeout 5 --max-time 15 "${HEALTH_URL}" || echo "000")

          if [ "$HTTP_CODE" = "200" ]; then
            echo "Smoke test passed: ${HEALTH_URL} returned HTTP ${HTTP_CODE}"
          else
            echo "Smoke test failed: ${HEALTH_URL} returned HTTP ${HTTP_CODE}"
            exit 1
          fi
